COM_SIMPLESTATS_CONFIG_TRACK_AUTHENTICATED_DESC="Authentifizierte Besucher auf der öffentlichen Website zählen. Aufrufe im Administratorbereich werden niemals erfasst."
COM_SIMPLESTATS_CONFIG_EXCLUDED_USER_IDS="Ausgeschlossene Joomla-Benutzer-IDs"
COM_SIMPLESTATS_CONFIG_EXCLUDED_USER_IDS_DESC="Optionale, kommagetrennte Benutzer-IDs, deren Frontend-Aktivität nicht gezählt werden soll, zum Beispiel das eigene Konto. Benutzer-IDs werden nur zum Ausschluss verwendet und nicht in Statistikereignissen gespeichert."
COM_SIMPLESTATS_CONFIG_EXCLUDE_COMPONENTS="Ausgeschlossene Komponenten"
COM_SIMPLESTATS_CONFIG_EXCLUDE_COMPONENTS_DESC="Kommagetrennte option-Namen, deren normale Seitenaufrufe nicht erfasst werden. Explizite benutzerdefinierte Ereignisse von Erweiterungen werden durch diese Liste nicht blockiert."
COM_SIMPLESTATS_CONFIG_EXCLUDE_PATHS="Ausgeschlossene Pfadpräfixe"
COM_SIMPLESTATS_CONFIG_EXCLUDE_PATHS_DESC="Ein öffentlicher URL-Pfadpräfix pro Zeile."
COM_SIMPLESTATS_CONFIG_STORE_QUERY="Abfragezeichenfolgen speichern"
COM_SIMPLESTATS_CONFIG_STORE_QUERY_DESC="Abfrageparameter nach Entfernung einer kurzen Liste sensibler Parameternamen in Seitenpfaden speichern. Für stärkere Datensparsamkeit deaktiviert lassen."
COM_SIMPLESTATS_CONFIG_PRIVACY="Datenschutz und Speicherung"
COM_SIMPLESTATS_CONFIG_RETENTION_DAYS="Aufbewahrung in Tagen"
COM_SIMPLESTATS_CONFIG_CLEANUP_PROBABILITY="Bereinigungswahrscheinlichkeit"
COM_SIMPLESTATS_CONFIG_CLEANUP_PROBABILITY_DESC="Prozentuale Wahrscheinlichkeit, dass ein zulässiges Ereignis das Löschen abgelaufener Zeilen auslöst."
COM_SIMPLESTATS_CONFIG_TRUSTED_IP_HEADER="Vertrauenswürdiger Client-IP-Header"
COM_SIMPLESTATS_CONFIG_TRUSTED_IP_HEADER_DESC="Optionale Servervariable, die von einem vertrauenswürdigen Reverse Proxy gesetzt und überschrieben wird. Leer lassen, um REMOTE_ADDR zu verwenden; ist diese Adresse privat oder reserviert, kann Simple Stats sicher auf die letzte öffentliche Adresse aus X-Forwarded-For zurückgreifen."
COM_SIMPLESTATS_CONFIG_COUNTRY="Ländererkennung"
COM_SIMPLESTATS_CONFIG_COUNTRY_DETECTION="Erkennungsmethode"
COM_SIMPLESTATS_CONFIG_COUNTRY_DETECTION_DESC="Länder lokal mit DB-IP Lite auflösen, einen vertrauenswürdigen Proxy-Header verwenden oder die Erkennung deaktivieren. Besucher-IP-Adressen werden nie an DB-IP gesendet."
COM_SIMPLESTATS_CONFIG_COUNTRY_DISABLED="Deaktiviert"
COM_SIMPLESTATS_CONFIG_COUNTRY_LOCAL_DBIP="Lokale DB-IP-Lite-Datenbank"
COM_SIMPLESTATS_CONFIG_COUNTRY_HEADER="Vertrauenswürdiger Länder-Header"
COM_SIMPLESTATS_CONFIG_TRUSTED_COUNTRY_HEADER="Vertrauenswürdiger Länder-Header"
COM_SIMPLESTATS_CONFIG_TRUSTED_COUNTRY_HEADER_DESC="Servervariable mit einem ISO-3166-1-Alpha-2-Ländercode, zum Beispiel HTTP_CF_IPCOUNTRY. Nur hinter einem vertrauenswürdigen Proxy konfigurieren, der den Header überschreibt."
