COM_SIMPLESTATS_COUNTRY_DATABASE_STATUS="DB-IP Lite zuletzt aktualisiert: %1$s. Enthält %2$d IPv4- und %3$d IPv6-Bereiche."
COM_SIMPLESTATS_COUNTRY_DATABASE_MISSING="Es ist noch keine lokale Länderdatenbank installiert. Verwende in der Werkzeugleiste Länderdatenbank aktualisieren. Bis dahin liefert die lokale Ländererkennung Unbekannt."
COM_SIMPLESTATS_COUNTRY_DATABASE_UNREADABLE="Die Metadaten der Länderdatenbank sind vorhanden, aber eine oder beide kompilierten Nachschlagedateien fehlen, sind nicht lesbar oder unvollständig. Aktualisiere die Länderdatenbank erneut."
COM_SIMPLESTATS_COUNTRY_DATABASE_FORWARD_ONLY="Ländercodes werden beim Erfassen eines Ereignisses zugewiesen. Bereits vorhandene Einträge mit unbekanntem Land können nicht nachträglich repariert werden, da Simple Stats bewusst keine Besucher-IP-Adressen speichert."
COM_SIMPLESTATS_COUNTRY_ONLY_UNKNOWN="Die Datenbank ist installiert, aber dieser Auswertungszeitraum enthält nur unbekannte Länder. Alte Einträge bleiben nach einer Aktualisierung unbekannt. Bleiben auch neu erfasste Besuche unbekannt, stellt der Webserver wahrscheinlich nur eine Proxy-Adresse bereit; konfiguriere dann in den Simple-Stats-Optionen den vertrauenswürdigen Client-IP-Header."
COM_SIMPLESTATS_COUNTRY_NEW_EVENTS_ONLY="Die Ländererkennung gilt für neu erfasste Statistiken. Eine Aktualisierung der Datenbank ändert vorhandene Einträge mit unbekanntem Land nicht."
COM_SIMPLESTATS_PRIVACY_NOTE="Es werden keine Analyse-Cookies gesetzt. Rohe IP-Adressen und vollständige User-Agent-Zeichenfolgen werden nicht gespeichert. Tägliche HMAC-Besucherkennungen wechseln an jedem lokalen Kalendertag. Der Anmeldestatus wird nur als Ja/Nein gespeichert; Joomla-Benutzer-IDs werden nie mit Statistikereignissen gespeichert."
COM_SIMPLESTATS_DBIP_ATTRIBUTION="IP-zu-Land-Daten von <a href=\"https://db-ip.com/\" target=\"_blank\" rel=\"noopener noreferrer\">DB-IP.com</a>, lizenziert unter CC BY 4.0."
